<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" preserveAspectRatio="none">
  <defs>
    <radialGradient id="bg" cx="45%" cy="45%" r="75%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef0f4"/><stop offset="1" stop-color="#d9dce4"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3030"/><stop offset=".45" stop-color="#d50a0a"/><stop offset="1" stop-color="#7a0000"/>
    </linearGradient>
    <linearGradient id="red2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a0000"/><stop offset=".5" stop-color="#e01010"/><stop offset="1" stop-color="#ff3a3a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".6"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect width="210" height="297" fill="url(#bg)"/>
  <!-- seda branca canto superior direito -->
  <g fill="none" stroke-linecap="round">
    <path d="M110 0 C140 18 170 34 210 30" stroke="#c9ccd6" stroke-width="6" opacity=".35" filter="url(#soft)"/>
    <path d="M130 0 C155 14 180 22 210 16" stroke="#fff" stroke-width="5" opacity=".9" filter="url(#soft)"/>
    <path d="M100 6 C135 34 175 48 210 44" stroke="#fff" stroke-width="3" opacity=".8" filter="url(#soft)"/>
    <path d="M150 0 C170 10 190 12 210 6" stroke="#cfd2db" stroke-width="2" opacity=".5" filter="url(#glow)"/>
  </g>
  <!-- canto superior esquerdo -->
  <path d="M0 0 H98 C62 6 26 24 0 64 Z" fill="url(#red2)"/>
  <path d="M0 0 H70 C42 6 18 18 0 42 Z" fill="url(#red)"/>
  <path d="M0 50 C20 24 52 8 94 1" fill="none" stroke="#fff" stroke-width="1.2" opacity=".85" filter="url(#glow)"/>
  <path d="M0 58 C24 28 58 10 98 2" fill="none" stroke="#ffb3b3" stroke-width=".5" opacity=".9"/>
  <path d="M0 34 C14 18 34 8 60 2" fill="none" stroke="#fff" stroke-width=".7" opacity=".6" filter="url(#glow)"/>
  <!-- faixa inferior -->
  <path d="M0 262 C55 292 150 294 210 252 V297 H0 Z" fill="url(#red2)"/>
  <path d="M0 274 C60 298 160 292 210 266 V297 H0 Z" fill="url(#red)"/>
  <path d="M0 286 C70 302 170 290 210 280 V297 H0 Z" fill="#8a0000" opacity=".7"/>
  <path d="M0 262 C55 292 150 294 210 252" fill="none" stroke="#fff" stroke-width="1.3" opacity=".9" filter="url(#glow)"/>
  <path d="M0 274 C60 298 160 292 210 266" fill="none" stroke="#ffc2c2" stroke-width=".5" opacity=".8"/>
  <path d="M20 250 C80 272 150 270 205 258" fill="none" stroke="#fff" stroke-width="4" opacity=".7" filter="url(#soft)"/>
</svg>
